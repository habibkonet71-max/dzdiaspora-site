<!DOCTYPE html>
<html lang="fr">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZQC5E54Z71"></script>

    function gtag(){dataLayer.push(arguments);}

    gtag('config', 'G-ZQC5E54Z71');

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assistant DZ Diaspora — Posez votre question</title>
  <meta name="description" content="Assistant intelligent DZ Diaspora : posez vos questions sur la justice, la douane, le transport et plus encore.">
  <link rel="canonical" href="https://dzdiaspora.online/assistant.html">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">DZ Diaspora</a>
    <nav class="nav-desktop">
      <a href="index.html">🏠 Accueil</a>
      <a href="assistant.html" class="active">🤖 Assistant</a>
    </nav>
    <div id="auth-btn-header" style="margin-left:6px"></div>
    <button class="menu-btn" id="menuBtn">⋮</button>
  </header>
  <main class="page-content">
    <h1>🤖 Assistant DZ Diaspora</h1>
    <p class="intro">Posez votre question sur la justice, la douane, le transport ou tout autre sujet — l assistant repond en s appuyant sur les fiches officielles du site.</p>

    <section class="bloc">
      <div class="form-group">
        <textarea id="question-assistant" rows="3" placeholder="Ex: Comment declarer des devises a la douane algerienne ?" style="width:100%;padding:12px;border-radius:10px;background:#1C2333;color:white;border:1px solid rgba(255,255,255,0.15);box-sizing:border-box;"></textarea>
      </div>
      <button id="btn-demander" onclick="window.demanderAssistant()" style="width:100%;padding:13px;background:#4DD0E1;color:#0D1117;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;">💬 Demander a l assistant</button>

      <div id="reponse-assistant" style="display:none;margin-top:20px;padding:16px;background:rgba(168,224,99,0.06);border:1px solid rgba(168,224,99,0.3);border-radius:12px;">
        <p id="texte-reponse" style="color:white;font-size:14px;line-height:1.6;white-space:pre-wrap;"></p>
        <div id="sources-reponse" style="margin-top:12px;font-size:12px;color:rgba(255,255,255,0.5);"></div>
      </div>
    </section>
  </main>
  <footer>
    <p>DZ Diaspora — Tous droits reserves</p>
    <p><a href="cgu.html">CGU</a> · <a href="contact.html">Contact</a></p>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-functions.js";
    const firebaseConfig = {
      apiKey: "AIzaSyDdOF-MYm0nTq0aNG6pk-wQLaYujiNuMWQ",
      appId: "1:223003656315:web:100de190b8b5e74ddae2de",
      messagingSenderId: "223003656315",
      projectId: "dzdiaspora-7260a",
      authDomain: "dzdiaspora-7260a.firebaseapp.com",
      storageBucket: "dzdiaspora-7260a.firebasestorage.app"
    };
    const app = initializeApp(firebaseConfig);
    const functions = getFunctions(app);

    window.demanderAssistant = async function() {
      const question = document.getElementById('question-assistant').value.trim();
      if (!question) { alert('Ecrivez votre question avant de valider.'); return; }
      const btn = document.getElementById('btn-demander');
      const reponseDiv = document.getElementById('reponse-assistant');
      const texteReponse = document.getElementById('texte-reponse');
      const sourcesDiv = document.getElementById('sources-reponse');

      btn.disabled = true;
      btn.textContent = '⏳ Reflexion en cours...';
      reponseDiv.style.display = 'none';

      try {
        const demander = httpsCallable(functions, 'demanderAssistant');
        const result = await demander({ question });
        texteReponse.textContent = result.data.reponse;
        const sources = result.data.sources || [];
        sourcesDiv.innerHTML = sources.length > 0
          ? '📚 Sources : ' + sources.map(s => s.page_source ? `<a href="${s.page_source}" style="color:#4DD0E1;">${s.titre}</a>` : s.titre).join(' · ')
          : '';
        reponseDiv.style.display = 'block';
      } catch (e) {
        texteReponse.textContent = '❌ Erreur : ' + (e.message || 'Impossible de contacter l assistant. Reessayez.');
        reponseDiv.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = '💬 Demander a l assistant';
      }
    };
  </script>
  <script src="script.js"></script>
  <script src="traduction.js?v=6"></script>
  <script src="depannage.js"></script>
</body>
</html>
