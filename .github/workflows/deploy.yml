name: Deploy DZ Diaspora Site

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/**"

# --- CONTRAT : mutex partage avec sentinelle.yml -------------------------
# deploy.yml et sentinelle.yml mutent le MEME etat : le contenu deploye en
# prod (hosting) ET la branche main (deploy.yml via restauration scopee
# hors .github/ + tag last-known-good ; sentinelle.yml via restauration
# scopee + push). Les faire tourner en parallele = deux `firebase deploy`
# et deux ecritures sur main qui se marchent dessus. Ils partagent donc un
# groupe de concurrence unique : GitHub Actions ne laisse qu'UN run de ce
# groupe s'executer a la fois.
#
# cancel-in-progress: false => le second run declenche ATTEND la fin du
# premier, ne l'interrompt jamais (annuler un deploy/restauration a
# mi-course laisserait la prod dans un etat partiel).
#
# Nom de groupe distinct de dzdiaspora_app et ot_app -- lisibilite humaine
# uniquement : GitHub scope `concurrency` PAR DEPOT, aucune collision
# inter-depots possible meme avec un nom identique.
concurrency:
  group: deploiement-restauration-dzdiaspora-site
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verifier l'absence de paquets npm compromis
        run: node .github/scripts/verifier-paquets-compromis.js

      # Mutex deploy.yml <-> sentinelle.yml : meme groupe de concurrence
      # litteral + cancel-in-progress: false des deux cotes. Ce check est
      # AUSSI dans garde-fous-ci.yml (declenche quand .github/ change) --
      # ici, defense en profondeur avant un vrai deploiement.
      - name: Verifier le mutex deploy.yml <-> sentinelle.yml
        run: node .github/scripts/verifier-mutex-workflows.js

      - name: Installer les dependances
        run: npm ci

      - name: Linter JS (no-unused-vars, no-empty, no-silent-catch)
        run: npm run lint

      - name: Validite structurelle du HTML (balises mal fermees)
        run: npm run lint:html

      - name: Liens/cartes dupliques dans les menus et grilles
        run: npm run lint:doublons

      - name: Pages admin protegees (verrou PIN)
        run: npm run lint:admin

  deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Installer Firebase CLI
        run: npm install -g firebase-tools

      - name: Deployer
        id: deploy
        run: firebase deploy --only hosting --project dzdiaspora-7260a --non-interactive

      # Prealables du test de fumee navigateur : Node + Chromium headless.
      # .npmrc a ignore-scripts=true -> npm ci NE telecharge PAS les
      # navigateurs Playwright ; l'install explicite ci-dessous le fait
      # (avec cache sur ~/.cache/ms-playwright, cle = hash du lockfile).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache navigateurs Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Installer dependances + Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Test de fumee : verifie que le commit qu'on vient de deployer n'a pas
      # casse le site ou fait disparaitre le verrou PIN d'une page admin sur
      # le HTML reellement servi (pas juste dans le code source - c'est ce
      # que verifie deja npm run lint:admin ci-dessus). Signal etroit et
      # immediat (ce deploiement precis), pas un jugement large sur une
      # fenetre de 24h.
      - name: Test de fumee
        id: smoke
        run: |
          sleep 10
          code_site=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "https://dzdiaspora.online/")
          if [ "$code_site" != "200" ]; then
            echo "Site injoignable (code $code_site)"
            exit 1
          fi
          for page in admin-pro admin-pub admin-rdv; do
            html=$(curl -s --max-time 15 "https://dzdiaspora.online/$page.html")
            # here-string plutot que echo "$html" | grep -q : le shell des
            # runners GitHub Actions active pipefail par defaut, et sur un
            # gros contenu (~90 Ko) grep -q peut fermer le tuyau des sa
            # premiere correspondance, causant un SIGPIPE cote echo qui
            # remonte comme un echec meme quand le motif a bien ete trouve.
            if ! grep -q 'id="ecran-pin"' <<< "$html" || ! grep -q "validerPin" <<< "$html"; then
              echo "Verrou PIN absent sur $page.html (site en ligne)"
              exit 1
            fi
          done
          echo "Test de fumee curl OK"
          # --- verif navigateur synthetique : le JS des pages publiques
          #     est-il vraiment vivant sur le HTML deploye ? (curl ne le
          #     voit pas -- cf. incident el_main du 2026-08-30). ---
          set +e
          verdict=$(node .github/scripts/verifier-sante-navigateur.mjs 2>nav.txt | tail -n 1)
          set -e
          echo "--- detail verif navigateur ---"
          cat nav.txt
          if [ "$verdict" != "sain" ]; then
            echo "Verif navigateur : ${verdict:-<aucun verdict>} (voir detail ci-dessus)"
            exit 1
          fi
          echo "Test de fumee navigateur OK"

      # Avance le tag mobile last-known-good sur ce commit : c'est la cible
      # que la sentinelle (workflow separe et planifie quotidien,
      # sentinelle.yml) restaurera en cas de souci majeur detecte plus tard.
      # Distinct des points de restauration manuels (vX.Y-stable-...), qui
      # restent un mecanisme separe pour vos propres jalons volontaires.
      - name: Avancer le tag last-known-good
        if: steps.smoke.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f last-known-good
          git push origin last-known-good --force

      # Restauration automatique : uniquement si le test de fumee echoue
      # juste apres CE deploiement precis. Restaure tout le contenu suivi
      # (hors .github/) a son etat last-known-good (le tag n'a PAS ete avance
      # -- "Avancer le tag last-known-good" ne tourne que sur smoke OK), puis
      # redeploie. MEME mecanisme que sentinelle.yml, volontairement PAS
      # `git revert HEAD` : (1) reverter un commit qui touche
      # .github/workflows/ est rejete au push ("refusing to allow a GitHub
      # App to create or update workflow ... without workflows permission") ;
      # (2) les fichiers de pipeline ne sont pas servis par Firebase Hosting,
      # les restaurer n'a aucun effet ; (3) restaurer vers un etat eprouve
      # est immunise contre les boucles.
      - name: Restauration automatique si echec
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify refs/tags/last-known-good >/dev/null; then
            echo "::error::last-known-good introuvable -- restauration impossible, verification manuelle requise."
            exit 1
          fi
          mapfile -t restore_paths < <(git ls-tree --name-only last-known-good | grep -v '^\.github$')
          git checkout last-known-good -- "${restore_paths[@]}"
          if git diff --cached --quiet; then
            echo "::error::Rien a restaurer hors .github/ -- verification manuelle requise."
            exit 1
          fi
          git commit -m "Restauration automatique (deploy) vers last-known-good"
          firebase deploy --only hosting --project dzdiaspora-7260a --non-interactive
          git push origin main

      - name: Alerte si la restauration elle-meme echoue
        if: failure()
        run: echo "::error::Deploiement et/ou restauration automatique en echec — verification manuelle requise."
